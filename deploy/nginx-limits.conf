# Managed: Gerstep Interactive. Nginx http context; names do not affect other apps.
map $http_upgrade $gerstep_interactive_connection {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=gerstep_interactive_requests:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=gerstep_interactive_connections:1m;
