# Managed: Gerstep Interactive. Include inside the existing HTTPS server block.
location = /Gerstep {
    return 308 /Gerstep/;
}
location ^~ /Gerstep/ {
    proxy_pass http://127.0.0.1:9081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $gerstep_interactive_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 15s;
    client_max_body_size 64k;
    limit_req zone=gerstep_interactive_requests burst=30 nodelay;
    limit_conn gerstep_interactive_connections 12;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
}
